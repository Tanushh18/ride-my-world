name: Build and test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run unit tests
        run: npm test
      - name: Build production bundle
        run: npm run build
      - name: Verify live WebGL tour and resume content in a browser
        env:
          SMOKE_URL: 'http://127.0.0.1:5173/#debug&quality=low'
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/ride-my-world-vite.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 40); do
            if curl --silent --fail http://127.0.0.1:5173/ > /dev/null; then
              break
            fi
            sleep 1
          done
          curl --silent --fail http://127.0.0.1:5173/ > /dev/null || { cat /tmp/ride-my-world-vite.log; exit 1; }
          npm run smoke:tour
