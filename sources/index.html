<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Muhammad Mubazar Qureshi</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg">
    <meta name="description" content="Interactive 3D portfolio of Muhammad Mubazar Qureshi, senior full stack software engineer.">
</head>
<body>
    <div class="game js-game">
        <canvas class="canvas js-canvas"></canvas>
    </div>

    <div class="loader">
        <div class="loader-title">Loading</div>
    </div>

    <div class="failure">
        <div class="failure-title">This world could not start</div>
        <p class="failure-message js-error-message"></p>
    </div>

    <div class="hint">
        <span class="key">W A S D</span> drive
        <span class="key">Shift</span> boost
        <span class="key">Ctrl</span> brake
        <span class="key">R</span> respawn
        <span class="key">Drag</span> camera
    </div>

    <aside class="card js-card" aria-live="polite">
        <div class="card-head">
            <span class="card-year js-card-year"></span>
            <span class="card-role js-card-role"></span>
        </div>
        <h2 class="card-title js-card-title"></h2>
        <p class="card-description js-card-description"></p>
        <ul class="card-tags js-card-tags"></ul>
        <div class="card-links js-card-links"></div>
    </aside>

    <script type="module" src="./index.js"></script>
</body>
</html>
